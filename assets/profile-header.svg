<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">potatohoney-p profile header</title>
  <desc id="desc">An original abstract network illustrating local-first AI, inspectable knowledge, and agent systems.</desc>
  <defs>
